deploy prod:
  stage: deploy
  image: curlimages/curl:latest
  tags:
    - dokfin
  environment:
    name: prod
  before_script: []
  script:
    - |
      curl --fail --silent --show-error \
        --request POST \
        --form token=$DEPLOYMENT_TOKEN \
        --form ref=$CI_COMMIT_TAG \
        --form "variables[DEPLOY_APP]=advisor" \
        "https://gitlab.com/api/v4/projects/$DEPLOYMENT_PROJECT_ID/trigger/pipeline"
  interruptible: false
  dependencies: []
  retry: 2
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
